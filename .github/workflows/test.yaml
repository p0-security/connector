on:
  pull_request:
  workflow_call:

name: Test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup yarn
        uses: ./.github/actions/yarn-setup
      # Vitest resolves `@p0security/connector-core` through the package's
      # `exports` default condition (`dist/index.js`), not the `src` condition
      # that tsconfig's `customConditions` uses. Without this build,
      # connector-sdk's suite fails to resolve the workspace dependency.
      - name: Build monorepo
        run: yarn :build
      - name: Run tests
        run: yarn :test
