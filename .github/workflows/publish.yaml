on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release version to publish, e.g. v0.26.1-alpha.0
        required: true
        type: string

name: Publish

# Both packages release together, so a second run must never race the first.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version format and set output
        id: set-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          CORE=$(jq -r '.version' packages/connector-core/package.json)
          SDK=$(jq -r '.version' packages/connector-sdk/package.json)
          echo "connector-core: $CORE"
          echo "connector-sdk:  $SDK"
          if [ "$CORE" != "$SDK" ]; then
            echo "::error::Version mismatch: connector-core is $CORE but connector-sdk is $SDK. Both packages must be bumped together."
            exit 1
          fi
          VALIDATED_VERSION=$(PKG_VERSION="$CORE" bash scripts/validate-version.sh)
          echo "version=$VALIDATED_VERSION" >> "$GITHUB_OUTPUT"

  lint:
    uses: ./.github/workflows/lint.yaml
  test:
    uses: ./.github/workflows/test.yaml

  publish:
    name: Publish to npm
    needs: [validate, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup yarn
        uses: ./.github/actions/yarn-setup

      # Builds every workspace, then publishes in topological order so
      # connector-core reaches the registry before the SDK that depends on it.
      # `--tolerate-republish` makes an already-published version a warning, so
      # this job is safe to re-run after a partial failure.
      - name: Publish
        run: yarn :publish
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
