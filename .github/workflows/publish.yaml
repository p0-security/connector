on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-publish, e.g. v0.1.0
        required: true
        type: string

name: Publish

# Both packages release together, so a second run must never race the first.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # lint and test check out the tag rather than the caller's ref, so a manual
  # dispatch gates the publish on the code being published, not on the ref the
  # workflow was dispatched from.
  lint:
    uses: ./.github/workflows/lint.yaml
    with:
      ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}

  test:
    uses: ./.github/workflows/test.yaml
    with:
      ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}

  publish:
    name: Publish to npm
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Checking out the tag ref makes "the built commit is the tag's commit"
      # true by construction for both triggers, so the verify step below only
      # has to compare names. The `refs/tags/` prefix also stops a dispatch
      # from naming a branch.
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - name: Setup yarn
        uses: ./.github/actions/yarn-setup

      # Verifies that the core, sdk, and release versions all match.
      - name: Verify package versions
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          CORE=$(jq -r .version packages/connector-core/package.json)
          SDK=$(jq -r .version packages/connector-sdk/package.json)
          echo "connector-core: $CORE"
          echo "connector-sdk:  $SDK"
          echo "release tag:    $TAG"
          if [ "$CORE" != "$SDK" ]; then
            echo "::error::Version mismatch: connector-core is $CORE but connector-sdk is $SDK. Both packages must be bumped together."
            exit 1
          fi
          # Releases are plain major.minor.patch; pre-release and build
          # metadata suffixes are not supported by this pipeline.
          if ! echo "$CORE" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version $CORE is not in major.minor.patch format. Releases must be plain semver, e.g. 1.2.3."
            exit 1
          fi
          if [ "$TAG" != "v$CORE" ]; then
            echo "::error::Release tag $TAG does not match package version $CORE. Publishing is only allowed from a tag named v<major>.<minor>.<patch> matching both package.json files, i.e. v$CORE."
            exit 1
          fi

      # Builds every workspace, then publishes in topological order so
      # connector-core reaches the registry before the SDK that depends on it.
      # `--tolerate-republish` makes an already-published version a warning, so
      # this job is safe to re-run after a partial failure.
      - name: Publish
        run: yarn :publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
