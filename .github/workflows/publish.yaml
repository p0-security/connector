on:
  release:
    types: [published]
  workflow_dispatch:

name: Publish

# Both packages release together, so a second run must never race the first.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  test:
    uses: ./.github/workflows/test.yaml

  publish:
    name: Publish to npm
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-tags: true
      - name: Setup yarn
        uses: ./.github/actions/yarn-setup

      # Verifies that the core, sdk, and release versions all match.
      - name: Verify package versions
        run: |
          CORE=$(jq -r .version packages/connector-core/package.json)
          SDK=$(jq -r .version packages/connector-sdk/package.json)
          echo "connector-core: $CORE"
          echo "connector-sdk:  $SDK"
          if [ "$CORE" != "$SDK" ]; then
            echo "::error::Version mismatch: connector-core is $CORE but connector-sdk is $SDK. Both packages must be bumped together."
            exit 1
          fi
          # Releases are plain major.minor.patch; pre-release and build
          # metadata suffixes are not supported by this pipeline.
          if ! echo "$CORE" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version $CORE is not in major.minor.patch format. Releases must be plain semver, e.g. 1.2.3."
            exit 1
          fi
          TAGS=$(git tag --points-at HEAD | tr '\n' ' ')
          echo "tags on HEAD:   ${TAGS:-none}"
          if ! echo "$TAGS" | tr ' ' '\n' | grep -Fqx "v$CORE"; then
            echo "::error::HEAD is not tagged v$CORE. Publishing is only allowed from a commit tagged v<major>.<minor>.<patch>. Tags on this commit: ${TAGS:-none}"
            exit 1
          fi

      # Builds every workspace, then publishes in topological order so
      # connector-core reaches the registry before the SDK that depends on it.
      # `--tolerate-republish` makes an already-published version a warning, so
      # this job is safe to re-run after a partial failure.
      - name: Publish
        run: yarn :publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
